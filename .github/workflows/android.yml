name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 GitHub Release（版本取自 pubspec.yaml）'
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布版本'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.38.4'
  ANDROID_BUILD_TOOLS: '36.1.0'

jobs:
  build:
    name: Check and build split APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Test release publishing
        run: python3 -m unittest discover -s test -p ci_release_test.py -v

      - name: Read and validate version
        id: version
        shell: bash
        env:
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?)\+[0-9]+[[:space:]]*$/\1/p' pubspec.yaml)
          [[ -n "$version" ]] || { echo '::error::pubspec.yaml must contain version: x.y.z+build'; exit 1; }
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml ($tag)"
            exit 1
          fi
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/* ]]; then
            echo '::error::Publish from main or a version tag.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Configure Android signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/configure-android-signing.sh

      - name: Build APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Name APKs and generate SHA-256 checksums
        shell: pwsh
        run: ./scripts/build-android.ps1 -SkipBuild

      - name: Verify official APK signatures
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          APK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          bash scripts/verify-android-signing.sh dist "$APK_VERSION"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenClash-${{ steps.version.outputs.version }}-apks
          path: |
            dist/OpenClash-${{ steps.version.outputs.version }}-*.apk
            dist/SHA256SUMS-${{ steps.version.outputs.version }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.keystore"

  release:
    name: Publish GitHub Release
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OpenClash-${{ needs.build.outputs.version }}-apks
          path: dist

      - name: Create release and upload APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || contains(needs.build.outputs.version, '-') }}
        run: |
          export APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          bash scripts/publish-android.sh
